[project]
name = "job-application-automation"
version = "0.1.0"
description = "Compatibility-first tools for job discovery and application workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-genai",
    "openpyxl",
    "playwright",
    "PyMuPDF",
    "pypdf",
    "reportlab",
    "requests",
]

[project.scripts]
job-automation = "job_application_automation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["job_automation"]

[tool.setuptools.package-data]
job_application_automation = ["resources/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --disable-socket --cov=src --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "docs", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[project]
name = "job-application-automation"
version = "0.1.0"
description = "Compatibility-first tools for job discovery and application workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=0.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=0.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "PyMuPDF>=1.23.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
observability = [
    "sentry-sdk>=2.22,<3.0",
]
structured = [
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<3.0",
    "pip-audit>=2.9,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-socket>=0.7,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
job-automation = "job_application_automation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["job_automation"]

[tool.setuptools.package-data]
job_application_automation = [
    "dashboard/static/*",
    "resources/*.json",
    "resources/runtime/*.json",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --disable-socket --cov=src --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
show_error_codes = true
files = [
    "src/job_application_automation/core/application_candidates.py",
    "src/job_application_automation/core/ats_urls.py",
    "src/job_application_automation/core/contracts.py",
    "src/job_application_automation/core/submission_log.py",
    "src/job_application_automation/core/document_archive.py",
    "src/job_application_automation/search/models.py",
    "src/job_application_automation/search/providers",
    "src/job_application_automation/core/runtime_config.py",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "docs", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "UP"]
ignore = [
    "B904",
    "B905",
    # These patterns are intentional in browser automation and controlled
    # process/network adapters. Functional tests cover their failure paths.
    "S110",
    "S112",
    "S310",
    "S311",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "B018", "S101", "S105", "S106", "S108"]

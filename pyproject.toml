[project]
name = "job-application-automation"
version = "0.1.0"
description = "AI-powered job discovery, resume tailoring, and multi-ATS application automation engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ddgs>=0.1.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-genai>=0.1.0",
    "openpyxl>=3.1.0",
    "playwright>=1.40.0",
    "PyMuPDF>=1.23.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
observability = [
    "sentry-sdk>=2.22,<3.0",
]
structured = [
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<3.0",
    "pip-audit>=2.9,<3.0",
    "ruff>=0.6,<1.0",
    "setuptools>=83.0.0",
]

[project.scripts]
job-automation = "job_application_automation.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["job_automation"]

[tool.setuptools.package-data]
job_application_automation = [
    "dashboard/static/*",
]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
show_error_codes = true
files = [
    "src/job_application_automation/core/orchestrator.py",
    "src/job_application_automation/core/continuous_ats.py",
    "src/job_application_automation/core/continuous_source_ats.py",
    "src/job_application_automation/core/application_pipeline.py",
    "src/job_application_automation/core/application_candidates.py",
    "src/job_application_automation/core/ats_urls.py",
    "src/job_application_automation/core/contracts.py",
    "src/job_application_automation/core/continuous_worker_application.py",
    "src/job_application_automation/core/continuous_worker_candidates.py",
    "src/job_application_automation/core/continuous_worker_models.py",
    "src/job_application_automation/core/continuous_worker_runtime.py",
    "src/job_application_automation/core/continuous_worker_sources.py",
    "src/job_application_automation/core/continuous_worker_state.py",
    "src/job_application_automation/core/submission_log.py",
    "src/job_application_automation/core/document_archive.py",
    "src/job_application_automation/search/support.py",
    "src/job_application_automation/search/job_boards.py",
    "src/job_application_automation/search/providers",
    "src/job_application_automation/core/runtime_config.py",
    "src/job_application_automation/core/runtime_config_models.py",
    "src/job_application_automation/dashboard",
    "src/job_application_automation/engines/browser_controls.py",
    "src/job_application_automation/engines/browser_runtime.py",
    "src/job_application_automation/engines/_browser_form.py",
    "src/job_application_automation/engines/ashby.py",
    "src/job_application_automation/engines/ashby_sections.py",
    "src/job_application_automation/engines/form_sections.py",
    "src/job_application_automation/engines/greenhouse.py",
    "src/job_application_automation/engines/lever.py",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "docs", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "UP"]
ignore = [
    "B904",
    "B905",
    # These patterns are intentional in browser automation and controlled
    # process/network adapters.
    "S110",
    "S112",
    "S310",
    "S311",
    "S603",
    "S607",
]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Logs | SkyBison Automation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Header Banner with SkyBison Logo -->
  <header class="app-header">
    <div class="brand">
      <div class="logo-container">
        <a href="index.html"><img src="sky_bison_logo.jpg" alt="Sky Bison Logo" class="brand-avatar"></a>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">SKY BISON AUTOMATION</h1>
        <span class="brand-subtitle">Avatar Studios Job Operations Engine</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="secondary-btn" onclick="fetchVpsStatus()">
        <span>📡 VPS Status Check</span>
      </button>
      <button class="sync-btn" id="syncBtn" onclick="triggerVpsSync()">
        <span>🌪️ Sync Reports from VPS</span>
      </button>
    </div>
  </header>

  <main class="container">

    <!-- Site Page Navigation Links -->
    <nav class="nav-tabs">
      <a href="index.html" class="tab-btn">📜 Submissions & Failures Matrix</a>
      <a href="search.html" class="tab-btn">🌊 Job Search & Coverage Details</a>
      <a href="generation.html" class="tab-btn">🪨 Generation Queue & Archives</a>
      <a href="logs.html" class="tab-btn active">🔥 Real-time VPS Sync Logs</a>
      <a href="inspector.html" class="tab-btn">📁 Raw File Inspector</a>
    </nav>

    <!-- REAL-TIME LOGS PAGE CONTENT -->
    <section>
      <div class="controls-bar">
        <input type="text" id="logSearch" class="search-input" placeholder="Filter log by keyword (e.g. Resume, Gemini, Error, Front)..." oninput="filterLogs()">
        <button class="secondary-btn" onclick="fetchVpsLog()">🔄 Refresh Log</button>
      </div>
      <div class="log-terminal" id="logTerminal">Loading real-time vps_sync.log...</div>
    </section>

  </main>

  <script src="dashboard.js"></script>
</body>
</html>

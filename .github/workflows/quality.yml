name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.1"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --dev --all-extras

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Check typed persistence and configuration boundaries
        run: uv run mypy

      - name: Build distributable wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          .wheel-smoke/bin/job-automation --help >/dev/null
          .wheel-smoke/bin/python - <<'PY'
          from job_application_automation.dashboard.server import STATIC_DIR

          index = STATIC_DIR / "index.html"
          assert index.is_file() and index.stat().st_size > 0, index
          PY
          echo "JOB_AUTOMATION_WHEEL_DIR=$PWD/dist" >> "$GITHUB_ENV"

      - name: Run deterministic tests with coverage
        run: uv run pytest

      - name: Compile source files
        run: uv run python -m compileall -q src

      - name: Check installed dependencies
        run: uv pip check

      - name: Audit installed locked dependencies
        run: uv run pip-audit --local --skip-editable

      - name: Smoke-test CLI help without live workflows
        shell: bash
        run: |
          set -euo pipefail
          uv run python src/job_automation.py --help >/dev/null
          for command in apply queue resume search gmail email-pool; do
            uv run python src/job_automation.py "$command" --help >/dev/null
          done
          for engine in ashby greenhouse lever; do
            uv run python src/job_automation.py engine "$engine" --help >/dev/null
          done

name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Run deterministic tests with coverage
        run: python -m pytest

      - name: Compile source files
        run: python -m compileall -q src

      - name: Check installed dependencies
        run: python -m pip check

      - name: Smoke-test CLI help without live workflows
        shell: bash
        run: |
          set -euo pipefail
          python src/job_automation.py --help >/dev/null
          for command in apply queue resume search gmail email-pool; do
            python src/job_automation.py "$command" --help >/dev/null
          done
          for engine in ashby greenhouse lever; do
            python src/job_automation.py engine "$engine" --help >/dev/null
          done
